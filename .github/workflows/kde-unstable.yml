# Builds and tests Tettegouche against the next Plasma before it ships, from
# Arch Linux's kde-unstable repository. Tettegouche links against Plasma's own
# libraries, so a new Plasma needs a rebuild; a red run here is an early
# warning about the coming release, not a failure of the released one. A push
# that changes the source or the tests runs it too, so a port to the next
# Plasma is checked before it merges.
name: Next Plasma (kde-unstable)

on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kde-unstable.yml"
      - "CMakeLists.txt"
      - "src/**"
      - "qml/**"
      - "applet/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: kde-unstable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Next Plasma
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Enable kde-unstable and the testing repositories it builds on
        run: |
          # kde-unstable sits above the testing repositories, which sit above
          # the stable ones, as Arch documents for this repository.
          sed -i '0,/^\[core\]/s//[kde-unstable]\nInclude = \/etc\/pacman.d\/mirrorlist\n\n[core-testing]\nInclude = \/etc\/pacman.d\/mirrorlist\n\n[extra-testing]\nInclude = \/etc\/pacman.d\/mirrorlist\n\n[core]/' /etc/pacman.conf
          grep -n '^\[' /etc/pacman.conf
          # The same stack as ci.yml. The last line is what a Plasma desktop
          # opens and draws Files' fixtures with.
          pacman -Syu --noconfirm --needed \
            git base-devel cmake ninja extra-cmake-modules python ripgrep dbus \
            qt6-base qt6-declarative qt6-svg \
            kcoreaddons kfilemetadata kglobalaccel ki18n kio krunner kservice \
            bluez-qt solid kirigami kpackage layer-shell-qt libplasma \
            plasma-workspace plasma-activities-stats kactivitymanagerd appstream-qt \
            kate okular ffmpegthumbs kdegraphics-thumbnailers
          # The words check reads its test catalogs only under a real locale.
          sed -i 's/^#en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
          locale-gen
          # Files' checks need a person who cannot read or write everywhere.
          useradd --create-home user

      - uses: actions/checkout@v5
        with:
          # The public-text check reads the messages of commits not yet on main.
          fetch-depth: 0

      - name: Record what was tested against
        run: |
          {
            echo "### Tested against"
            echo '```'
            pacman -Q plasma-workspace libplasma layer-shell-qt krunner kcoreaddons qt6-base
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify
        run: |
          chown -R user: "$GITHUB_WORKSPACE"
          runuser -u user -- env HOME=/home/user LANG=en_US.UTF-8 \
            CMAKE_GENERATOR=Ninja ./verify.sh
